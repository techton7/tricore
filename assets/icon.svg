<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <style>
    /* 기본 (Light 테마): 다크 차콜 */
    .tri-fill {
      fill: #111827;
      transition: fill 0.25s ease;
    }
    .tri-stroke {
      stroke: #111827;
      transition: stroke 0.25s ease;
    }
    /* Dark 테마: 선명한 순백색 */
    @media (prefers-color-scheme: dark) {
      .tri-fill {
        fill: #FFFFFF;
      }
      .tri-stroke {
        stroke: #FFFFFF;
      }
    }
  </style>

  <!-- 
    ================================================================
    1. 코드 상 [ORANGE]에 해당하는 6개 삼각형 면 채움
       (12시, 4시, 8시 외곽 뿔 + 12시, 4시, 8시 내부 삼각형)
       - 선(Path)과 완전히 동일한 색상(#111827 / #FFFFFF)을 적용
    ================================================================
  -->
  <g class="tri-fill" stroke="none">
    <!-- 외곽 뿔 3개 (12시, 4시, 8시) -->
    <polygon points="256,64 311.4,160 200.6,160" />
    <polygon points="366.9,256 422.3,352 311.4,352" />
    <polygon points="145.1,256 200.6,352 89.7,352" />

    <!-- 내부 삼각형 3개 (12시, 4시, 8시) -->
    <polygon points="200.6,160 311.4,160 256,256" />
    <polygon points="256,256 366.9,256 311.4,352" />
    <polygon points="145.1,256 256,256 200.6,352" />
  </g>

  <!-- 
    ================================================================
    2. 모든 와이어프레임 선 (면과 100% 동일한 색상)
    ================================================================
  -->
  <g class="tri-stroke" fill="none" stroke-width="10" stroke-linejoin="round" stroke-linecap="round">
    <!-- 정방향 큰 삼각형 외곽 -->
    <polygon points="256,64 422.3,352 89.7,352" />
    
    <!-- 역방향 큰 삼각형 외곽 -->
    <polygon points="256,448 89.7,160 422.3,160" />

    <!-- 내부 3개 평행 관통선 -->
    <line x1="145.1" y1="256" x2="366.9" y2="256" />
    <line x1="200.6" y1="160" x2="311.4" y2="352" />
    <line x1="311.4" y1="160" x2="200.6" y2="352" />
  </g>
</svg>